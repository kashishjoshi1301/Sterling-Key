<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="minimalPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#D5CDC2" />
      <stop offset="100%" stop-color="#A89B8A" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#darkBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Outer Octagonal Shield -->
  <polygon points="200,40 340,110 340,290 200,360 60,290 60,110" stroke="url(#minimalPlatinum)" stroke-width="3" stroke-linejoin="round" />

  <!-- Master Key Bow / Finial -->
  <circle cx="200" cy="145" r="42" stroke="url(#minimalPlatinum)" stroke-width="3.5" fill="#08090C"/>
  <circle cx="200" cy="145" r="16" stroke="#C8BCAC" stroke-width="2"/>

  <!-- Key Shaft -->
  <line x1="200" y1="187" x2="200" y2="305" stroke="url(#minimalPlatinum)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Key Teeth -->
  <line x1="200" y1="245" x2="238" y2="245" stroke="#C8BCAC" stroke-width="3.5" stroke-linecap="square"/>
  <line x1="200" y1="272" x2="230" y2="272" stroke="#C8BCAC" stroke-width="3.5" stroke-linecap="square"/>
</svg>
